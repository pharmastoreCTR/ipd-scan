<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a52">
<meta name="apple-mobile-web-app-title" content="เบิกยา IPD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>ระบบเบิกยา IPD</title>
<style>
html,body{margin:0;height:100%;background:#0a2a52;color:#dfe8f2;font-family:-apple-system,'Sarabun','Noto Sans Thai',Tahoma,sans-serif}
.b{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.b img{width:84px;height:84px;border-radius:20px}
.s{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#ff8a55;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:10px;padding:12px 20px;background:#ff8a55;color:#0a2a52;font-weight:700}
</style>
</head>
<body>
<div class="b"><img src="apple-touch-icon.png" alt=""><b style="font-size:20px">ระบบเบิกยา IPD</b><div class="s" id="sp"></div><div id="m">กำลังเปิดแอป…</div></div>
<script>
/* ตัวโหลดแอป: ดึงหน้าเว็บล่าสุดจาก Apps Script มาแสดง (แก้โค้ดที่ Apps Script ที่เดียว แอปนี้ได้ของใหม่เอง)
   เปิดครั้งต่อไปขึ้นทันทีจากสำเนาในเครื่อง แล้วแอบดึงเวอร์ชันใหม่เก็บไว้ใช้ครั้งถัดไป */
(function(){
  var SRC='https://script.google.com/macros/s/AKfycbxJYGTR7QCJ_RfSq2TCskDTvzdRyM2-G5ugawiVj1YVtXuTx0aJLgUq0MS05dHXSpiO/exec?raw=1';
  var KEY='ipd_app_html',cached=null;
  try{cached=localStorage.getItem(KEY)}catch(e){}
  function ok(h){return typeof h==='string'&&h.length>5000&&h.indexOf('<!DOCTYPE html>')===0}
  function show(h){document.open();document.write(h);document.close()}
  function fetchNew(){return fetch(SRC,{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){
    if(!ok(h))throw new Error('bad');try{localStorage.setItem(KEY,h)}catch(e){}return h})}
  if(ok(cached)){
    var t0=Date.now();
    // มีเวอร์ชันใหม่ภายใน 8 วินาทีแรกที่เปิด → โหลดใหม่ทันที (ยังไม่ทันได้ใช้งาน) ไม่งั้นได้ของใหม่ตอนเปิดครั้งถัดไป
    fetchNew().then(function(h){if(h!==cached&&Date.now()-t0<8000)location.reload()}).catch(function(){});
    // ต้องรอให้หน้านี้โหลดเสร็จก่อน document.open() ถึงจะแทนที่ทั้งหน้าได้ (ถ้าเรียกระหว่างโหลด จะไปแทรกต่อท้ายแทน)
    document.addEventListener('DOMContentLoaded',function(){show(cached)});return;
  }
  fetchNew().then(show).catch(function(){
    document.getElementById('sp').style.display='none';
    document.getElementById('m').innerHTML='เปิดแอปไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่<br><br><button onclick="location.reload()">ลองใหม่</button>';
  });
})();
</script>
</body>
</html>
